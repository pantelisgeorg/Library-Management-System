<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Charts - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark py-2">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> Library Management System</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-link text-white-50" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a class="nav-link text-white-50" href="/tables"><i class="bi bi-table"></i> Tables</a>
            <a class="nav-link text-white fw-semibold" href="/charts"><i class="bi bi-bar-chart"></i> Charts</a>
            <span class="navbar-text text-white-50 small">
                <i class="bi bi-person-circle"></i> <a class="text-white-50 text-decoration-none" href="/profile" sec:authentication="name">user</a>
            </span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="h3 mb-1">Charts</h1>
    <p class="text-muted">Activity at a glance</p>

    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="fs-1 text-primary"><i class="bi bi-arrow-left-right"></i></div>
                    <div>
                        <div class="text-muted text-uppercase small">Active Borrowings</div>
                        <div class="fs-3 fw-bold" th:text="${borrowingsByStatus != null ? #lists.size(borrowingsByStatus) : 0}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="fs-1 text-info"><i class="bi bi-people"></i></div>
                    <div>
                        <div class="text-muted text-uppercase small">Members</div>
                        <div class="fs-3 fw-bold" th:text="${usersByRole != null ? #lists.size(usersByRole) : 0}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold"><i class="bi bi-bar-chart"></i> Library Activity</div>
        <div class="card-body">
            <canvas id="activityChart" height="120"></canvas>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const activeBorrowings = [[${borrowingsByStatus != null ? borrowingsByStatus.size() : 0}]];
    const members = [[${usersByRole != null ? usersByRole.size() : 0}]];

    new Chart(document.getElementById('activityChart'), {
        type: 'bar',
        data: {
            labels: ['Active Borrowings', 'Members'],
            datasets: [{
                label: 'Count',
                data: [activeBorrowings, members],
                backgroundColor: ['rgba(13, 110, 253, 0.7)', 'rgba(25, 135, 84, 0.7)'],
                borderColor: ['rgb(13, 110, 253)', 'rgb(25, 135, 84)'],
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
        }
    });
</script>

</body>
</html>
