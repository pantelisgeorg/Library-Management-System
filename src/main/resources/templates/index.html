<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark py-2">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-book-half"></i> Library Management System</a>
        <div class="d-flex gap-3 align-items-center">
            <a class="nav-link text-white fw-semibold" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a class="nav-link text-white-50" href="/tables"><i class="bi bi-table"></i> Tables</a>
            <a class="nav-link text-white-50" href="/charts"><i class="bi bi-bar-chart"></i> Charts</a>
            <span class="navbar-text text-white-50 small">
                <i class="bi bi-person-circle"></i> <span sec:authentication="name">user</span>
            </span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <h1 class="h3 mb-1">Admin Dashboard</h1>
    <p class="text-muted">Overview of your library</p>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="fs-1 text-primary"><i class="bi bi-people"></i></div>
                    <div>
                        <div class="text-muted text-uppercase small">Total Users</div>
                        <div class="fs-3 fw-bold" th:text="${totalUsers}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="fs-1 text-success"><i class="bi bi-journal-bookmark"></i></div>
                    <div>
                        <div class="text-muted text-uppercase small">Total Books</div>
                        <div class="fs-3 fw-bold" th:text="${totalBooks}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="fs-1 text-info"><i class="bi bi-person-workspace"></i></div>
                    <div>
                        <div class="text-muted text-uppercase small">Total Authors</div>
                        <div class="fs-3 fw-bold" th:text="${totalAuthors}">0</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="fs-1 text-warning"><i class="bi bi-arrow-left-right"></i></div>
                    <div>
                        <div class="text-muted text-uppercase small">Active Borrowings</div>
                        <div class="fs-3 fw-bold" th:text="${activeBorrowings}">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h2 class="h5 mb-3"><i class="bi bi-lightning"></i> Quick links</h2>
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-primary" href="/tables"><i class="bi bi-table"></i> Browse data tables</a>
                <a class="btn btn-outline-success" href="/charts"><i class="bi bi-bar-chart"></i> View charts</a>
                <a class="btn btn-outline-secondary" sec:authorize="hasRole('ADMIN')" href="/api" target="_blank"><i class="bi bi-braces"></i> REST API</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
