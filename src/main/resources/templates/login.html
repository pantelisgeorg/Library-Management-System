<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card border-0 shadow" style="width: 24rem;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <div class="fs-1 text-success"><i class="bi bi-book-half"></i></div>
                <h1 class="h4 mb-1">Library Management System</h1>
                <p class="text-muted small mb-0">Please sign in to continue</p>
            </div>

            <div class="alert alert-danger py-2" th:if="${param.error}">
                <i class="bi bi-exclamation-triangle"></i> Invalid username or password.
            </div>
            <div class="alert alert-success py-2" th:if="${param.logout}">
                <i class="bi bi-check-circle"></i> You have been signed out.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-success w-100">
                    <i class="bi bi-box-arrow-in-right"></i> Sign in
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
